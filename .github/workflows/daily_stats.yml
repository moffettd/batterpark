name: Update Daily MLB Stats

on:
  schedule:
    # Runs at 10:00 AM UTC (6:00 AM EST) every day
    - cron: '0 10 * * *'
  workflow_dispatch: # Manual trigger button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1: Fetch stats and package the site
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pybaseball pandas

      - name: Fetch Stats and Build HTML
        run: python generate_stats.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

  # Job 2: Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_id: ${{ needs.build.outputs.artifact_id }}
