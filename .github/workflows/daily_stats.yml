name: Update Daily MLB Stats

on:
  schedule:
    # Runs at 10:00 AM UTC (6:00 AM EST) every day
    - cron: '0 10 * * *'
  workflow_dispatch: # Manual trigger button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pybaseball pandas

      - name: Fetch Stats and Build HTML
        run: python generate_stats.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Removes previous duplicate deployment artifacts in case of re-runs
      - name: Delete existing github-pages artifact
        run: |
          gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts?name=github-pages || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
